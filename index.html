<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Respawn Store</title>
</head>
<body>
    <header>
        <section class="logo">
            <img src="img/Titulo.png" alt="Logo">
        </section>

        <nav class="botonera">
            <a href="index.html">Inicio</a>
            <a href="pages/nosotros.html">Nosotros</a>
            <a href="#juegos">Catalogo</a>
        </nav>
    </header>
    <main>
        <section class="bienvenida">
            <h1>Bienvenidos a Respawn Store</h1>
            <h2>Tu tienda preferida</h2>
            <!-- <img src="/img/logo.png " alt=""> -->
        </section>

        <section class="catalogo" >
            <article class="juegos" id="juegos">
                <h2 class="tituloCatalogo">Juegos</h2> 
                <div class="imagenesCatalogo" id="contenedor-juegos"></div>
            </article>

            <div class="panelFlotante">
                <div class="panelFavorito">
                    <button id="btnFavoritos"><img src="img/iconos/favorito.png" alt="boton favorito"></button>
                    <p>Favorito</p>
                </div>
                <div class="panelFavorito">
                    <button id="btnCarrito"><img src="img/iconos/carrito.png" alt="boton carrito"></button>
                    <p>Compras</p>
                </div>
            </div>

        </section>
    </main>

    <aside class="sidebar" id="sidebar">
        
        <div class="botoneraAside">
            <h2 id="tituloAside"></h2>
            <button class="cerrarAside" id="cerrarAside"> X </button>
        </div>


        <div id="contenidoAside"></div>
    </aside>
    <div id="toast"></div>
    
    <footer>
        <section class="logo">
            <img src="img/Titulo.png" alt="Logo">
        </section>

        <nav class="botonera">
            <p>Siguenos en:</p>

            <div class="redsocial">
                <img src="img/redes sociales/twitter.png" alt="Twitter">
                <a href="#">Twitter</a>
            </div>

            <div class="redsocial">
                <img src="img/redes sociales/facebook.png" alt="Facebook">
                <a href="#">Facebook</a>
            </div>

            <div class="redsocial">
                <img src="img/redes sociales/instagram.png" alt="Instagram">
                <a href="#">Instagram</a>
            </div>

        </nav>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
