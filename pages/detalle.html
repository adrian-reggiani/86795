<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Respawn Store</title>
</head>
<body>
    <header>
        <section class="logo">
            <img src="../img/Titulo.png" alt="Logo">
        </section>

        <nav class="botonera">
            <a href="../index.html">Inicio</a>
            <a href="../pages/nosotros.html">Nosotros</a>
            <a href="../index.html#juegos">Catalogo</a>
        </nav>
    </header>
    
    <main class="detalle"> 
        <img src="" alt="" id="imgJuego">

        <article class="informacion" >
            <h1 id="nombreJuego"></h1>
            <p id="descripcionJuego"></p>
            <p class="precioJuego" id="precioJuego"></p>

            <div class="botones">
                <button id="btnComprarDetalle">Comprar</button>
                <button id="btnFavoritoDetalle">Favorito</button>
                <a href="../index.html"><button>Regresar</button></a>
            </div>
        </article>

    </main>

   <div id="toast"></div>
    <footer>
        <section class="logo">
            <img src="../img/Titulo.png" alt="Logo">
        </section>

        <nav class="botonera">
            <p>Siguenos en:</p>
            <div class="redessociales">

                <div class="redsocial">
                    <img src="../img/redes sociales/twitter.png" alt="Twitter">
                    <a href="#">Twitter</a>
                </div>
    
                <div class="redsocial">
                    <img src="../img/redes sociales/facebook.png" alt="Facebook">
                    <a href="#">Facebook</a>
                </div>
    
                <div class="redsocial">
                    <img src="../img/redes sociales/instagram.png" alt="Instagram">
                    <a href="#">Instagram</a>
                </div>
            </div>

        </nav>
    </footer>
    <script src="../js/detalle.js"></script>
</body>
</html>
